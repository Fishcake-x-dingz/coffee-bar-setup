<script>
const { useState, useEffect, useRef, useCallback } = React;

// ==================== UTILITIES ====================
const formatNumber = (num) => num ? num.toLocaleString("en-US") : "";
const parseNumber = (val) => Number(val.replace(/[^0-9]/g, "")) || 0;

// ==================== TOAST NOTIFICATIONS ====================
let toastId = 0;
function Toast({ message, type = "success", duration = 3000, onClose }) {
  useEffect(() => {
    const timer = setTimeout(onClose, duration);
    return () => clearTimeout(timer);
  }, [duration, onClose]);

  return React.createElement("div", { className: `toast toast-${type}` }, message);
}

// Toast manager hook
function useToast() {
  const [toasts, setToasts] = useState([]);

  const showToast = useCallback((message, type = "success", duration = 3000) => {
    const id = toastId++;
    setToasts(prev => [...prev, { id, message, type, duration }]);
  }, []);

  const removeToast = useCallback((id) => {
    setToasts(prev => prev.filter(t => t.id !== id));
  }, []);

  return { toasts, showToast, removeToast };
}

// ==================== FAVORITES MANAGEMENT ====================
const getFavorites = () => {
  try {
    const stored = localStorage.getItem("dosclose_favorites");
    return stored ? JSON.parse(stored) : [];
  } catch (e) {
    console.error("Error reading favorites:", e);
    return [];
  }
};

const addFavorite = (item) => {
  try {
    const favorites = getFavorites();
    if (!favorites.find(f => f.name === item.name && f.type === item.type)) {
      favorites.push({ ...item, type: item.type });
      localStorage.setItem("dosclose_favorites", JSON.stringify(favorites));
      return true;
    }
    return false;
  } catch (e) {
    console.error("Error adding favorite:", e);
    return false;
  }
};

const removeFavorite = (name, type) => {
  try {
    const favorites = getFavorites().filter(f => !(f.name === name && f.type === type));
    localStorage.setItem("dosclose_favorites", JSON.stringify(favorites));
  } catch (e) {
    console.error("Error removing favorite:", e);
  }
};

const isFavorite = (name, type) => {
  const favorites = getFavorites();
  return favorites.some(f => f.name === name && f.type === type);
};

// ==================== SHARE FUNCTIONALITY ====================
const generateShareLink = (machine, grinder, budget) => {
  const data = btoa(JSON.stringify({ machine: machine?.name, grinder: grinder?.name, budget }));
  return `${window.location.origin}${window.location.pathname}?shared=${data}`;
};

const generateQRCode = (text) => {
  return `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(text)}`;
};

// ==================== COMPONENTS ====================

        ),

          ),

          React.createElement("h3", { className: "text-lg font-bold text-gray-900 mb-4" }, "Specifications"),
          React.createElement("div", { className: "grid grid-cols-2 gap-4" },
            item.power && React.createElement("div", null,
              React.createElement("p", { className: "text-sm text-gray-500" }, "Power"),
              React.createElement("p", { className: "font-semibold" }, `${formatNumber(item.power)} W`)
            ),
            item.madeIn && React.createElement("div", null,
              React.createElement("p", { className: "text-sm text-gray-500" }, "Made In"),
              React.createElement("p", { className: "font-semibold" }, item.madeIn)
            ),
            isMachine && item.boilerType && React.createElement("div", null,
              React.createElement("p", { className: "text-sm text-gray-500" }, "Boiler Type"),
              React.createElement("p", { className: "font-semibold" }, item.boilerType)
            ),
            isMachine && item.waterCapacity && React.createElement("div", null,
              React.createElement("p", { className: "text-sm text-gray-500" }, "Water Capacity"),
              React.createElement("p", { className: "font-semibold" }, `${item.waterCapacity} L`)
            ),
            isMachine && item.steamPressure && React.createElement("div", null,
              React.createElement("p", { className: "text-sm text-gray-500" }, "Steam Pressure"),
              React.createElement("p", { className: "font-semibold" }, `${item.steamPressure} Bar`)
            ),
            isMachine && item.warranty && React.createElement("div", null,
              React.createElement("p", { className: "text-sm text-gray-500" }, "Warranty"),
              React.createElement("p", { className: "font-semibold" }, `${item.warranty} months`)
            ),
            !isMachine && item.burrType && React.createElement("div", null,
              React.createElement("p", { className: "text-sm text-gray-500" }, "Burr Type"),
              React.createElement("p", { className: "font-semibold" }, item.burrType)
            ),
            !isMachine && item.burrDiameter && React.createElement("div", null,
              React.createElement("p", { className: "text-sm text-gray-500" }, "Burr Diameter"),
              React.createElement("p", { className: "font-semibold" }, `${item.burrDiameter} mm`)
            ),
            !isMachine && item.grindSpeed && React.createElement("div", null,
              React.createElement("p", { className: "text-sm text-gray-500" }, "Grind Speed"),
              React.createElement("p", { className: "font-semibold" }, item.grindSpeed)
            ),
            !isMachine && item.hopperCapacity && React.createElement("div", null,
              React.createElement("p", { className: "text-sm text-gray-500" }, "Hopper Capacity"),
              React.createElement("p", { className: "font-semibold" }, `${item.hopperCapacity}${String(item.hopperCapacity).includes("Single Dose") ? "" : "g"}`)
            ),
            !isMachine && item.speed && React.createElement("div", null,
              React.createElement("p", { className: "text-sm text-gray-500" }, "Motor Speed"),
              React.createElement("p", { className: "font-semibold" }, `${item.speed} RPM`)
            )
          )
        ),
        item.features && React.createElement("div", { className: "mb-6" },
          React.createElement("h3", { className: "text-lg font-bold text-gray-900 mb-2" }, "Features"),
          React.createElement("p", { className: "text-gray-700" }, item.features)
        ),
        React.createElement("div", { className: "grid grid-cols-2 gap-3" },
          React.createElement("button", { 
            onClick: () => {
              if (addFavorite({ ...item, type: isMachine ? 'machine' : 'grinder' })) {
                showToast("❤️ Added to favorites!", "success");
              } else {
                showToast("Already in favorites", "info");
              }
            },
            className: "bg-red-50 text-red-600 py-2 rounded-lg font-semibold hover:bg-red-100 transition border border-red-200"
          }, "❤️ Favorite"),
          React.createElement("a", {
            href: `https://wa.me/6285282704370?text=Hi!, I'm interested in this ${isMachine ? 'coffee machine' : 'grinder'}:%0A${item.name} by ${item.brand}`,
            target: "_blank",
            rel: "noopener noreferrer",
            className: "block bg-green-500 text-white text-center py-2 rounded-lg font-semibold hover:bg-green-600 transition"
          }, "💬 WhatsApp")
        )
      )
    )
  );
}

function BackButton({ onBack }) {
  return React.createElement("button", { 
    onClick: onBack, 
    className: "mb-6 flex items-center gap-2 underline text-gray-700 hover:text-black transition focus:ring-2 focus:ring-offset-2 focus:ring-gray-700 rounded px-1",
    "aria-label": "Go back to home"
  }, "← Back");
}

function Home({ goToRecommend, goToCompare, goToBrowse, goToFavorites }) {
  return React.createElement("div", { className: "text-center fade-in" },
    React.createElement("div", { className: "py-10" },
      React.createElement("img", { src: "logo.png", className: "mx-auto w-[90%] md:w-[420px]", alt: "DoseClose Logo", style: { maxWidth: "90%", height: "auto" } })
    ),
    React.createElement("div", { className: "bg-[#b8a999] rounded-3xl py-20 px-10 max-w-4xl mx-auto mb-10" },
      React.createElement("p", { className: "text-lg text-gray-900" }, "Find your perfect coffee setup without confusion. Just input your budget and let us guide you.")
    ),
    React.createElement("div", { className: "flex flex-col md:flex-row justify-center gap-4 pb-20 px-4 flex-wrap" },
      React.createElement("button", { onClick: goToRecommend, className: "flex-1 min-w-[200px] bg-gradient-to-r from-black to-gray-800 text-white px-8 py-4 rounded-2xl text-lg font-semibold hover:shadow-lg transition" }, "💡 Recommend Me!"),
      React.createElement("button", { onClick: goToCompare, className: "flex-1 min-w-[200px] bg-black text-white px-8 py-4 rounded-2xl text-lg font-semibold hover:bg-gray-800 transition" }, "⚖️ Compare"),
      React.createElement("button", { onClick: goToBrowse, className: "flex-1 min-w-[200px] bg-black text-white px-8 py-4 rounded-2xl text-lg font-semibold hover:bg-gray-800 transition" }, "🔍 Browse"),
      React.createElement("button", { onClick: goToFavorites, className: "flex-1 min-w-[200px] bg-red-600 text-white px-8 py-4 rounded-2xl text-lg font-semibold hover:bg-red-700 transition" }, "❤️ Favorites")
    )
  );
}

function FavoritesPage({ onBack, showToast }) {
  const [favorites, setFavorites] = useState(getFavorites());
  const [modalItem, setModalItem] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const removeFav = (name, type) => {
    removeFavorite(name, type);
    setFavorites(getFavorites());
    showToast("Removed from favorites", "info");
    setConfirmDelete(null);
  };

  return React.createElement("div", { className: "p-10 max-w-6xl mx-auto fade-in" },
    React.createElement(BackButton, { onBack }),
    React.createElement("h2", { className: "text-3xl font-bold mb-8 text-gray-900" }, `❤️ Your Favorites (${favorites.length})`),
    favorites.length === 0 ? React.createElement("div", { className: "text-center py-16 text-gray-500" },
      React.createElement("p", { className: "text-xl mb-2" }, "No favorites yet!"),
      React.createElement("p", { className: "text-sm" }, "Start exploring and adding items to your wishlist.")
    ) : React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" },
      favorites.map(item =>
        React.createElement("div", { key: `${item.name}-${item.type}`, className: "bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-200 hover:shadow-xl transition fade-in" },
          React.createElement("div", { 
            onClick: () => setModalItem(item),
            className: "cursor-pointer h-full flex flex-col"
          },
            item.imageUrl && React.createElement("img", { src: item.imageUrl, alt: item.name, className: "w-full h-48 object-cover", onError: (e) => { e.target.style.display = "none"; } }),
            React.createElement("div", { className: "p-4 flex-1 flex flex-col" },
              React.createElement("h3", { className: "font-bold text-lg text-gray-900 mb-1" }, item.name),
              React.createElement("p", { className: "text-gray-600 text-sm mb-2" }, item.brand),
              React.createElement("p", { className: "text-2xl font-bold text-green-600 mb-3 mt-auto" }, `Rp ${formatNumber(item.price)}`),
              React.createElement("p", { className: "text-xs text-gray-500" }, `${item.type === 'machine' ? '☕ Machine' : '⚙️ Grinder'}`)
            )

          React.createElement("button", {

          }, "Cancel"),
          React.createElement("button", { 
            onClick: () => {
              const [name, type] = confirmDelete.split('-');

          }, "Remove")
        )
      )
    ),
    modalItem && React.createElement(ProductModal, { item: modalItem, isMachine: modalItem.type === 'machine', onClose: () => setModalItem(null), showToast })
  );
}

function RecommendationPage({ machines, grinders, onBack, showToast }) {
  const [budgetInput, setBudgetInput] = useState("");
  const [budget, setBudget] = useState(0);
  const [machinePct, setMachinePct] = useState(70);
  const [grinderPct, setGrinderPct] = useState(30);
  const [result, setResult] = useState(null);
  const [showShare, setShowShare] = useState(false);
  const [copySuccess, setCopySuccess] = useState(false);
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  const handleBudgetChange = (val) => {
    const num = parseNumber(val);
    setBudget(num);
    setBudgetInput(val === "" ? "" : formatNumber(num));
  };

  const getBestItem = (items, maxBudget) => {
    const withinBudget = items.filter(i => i.price <= maxBudget);
    if (withinBudget.length > 0) {
      return withinBudget.sort((a, b) => b.price - a.price)[0];
    }
    return items.sort((a, b) => a.price - b.price)[0];
  };

  const getCheapest = (items) => {
    return [...items].sort((a, b) => a.price - b.price)[0];
  };

  const setAllocationPreset = (machinePct) => {
    setMachinePct(machinePct);
    setGrinderPct(100 - machinePct);
  };

  const generate = () => {
    if (!budget) {
      showToast("Please enter your budget", "error");
      return;
    }

    let machine = null;
    let grinder = null;

    if (machinePct > 0) {
      const machineBudget = budget * (machinePct / 100);
      machine = getBestItem(machines, machineBudget);
    }

    if (grinderPct > 0) {
      const grinderBudget = budget * (grinderPct / 100);
      grinder = getBestItem(grinders, grinderBudget);
    }

    let message = "";
    let remaining = 0;
    let totalUsed = (machine?.price || 0) + (grinder?.price || 0);

    if ((machinePct > 0 && !machine) || (grinderPct > 0 && !grinder)) {
      let bestMachine = getBestItem(machines, budget);
      let bestGrinder = getBestItem(grinders, budget);

      if (!bestMachine) bestMachine = getCheapest(machines);
      if (!bestGrinder) bestGrinder = getCheapest(grinders);

      const minSetup = getCheapest(machines).price + getCheapest(grinders).price;

      if (budget < minSetup) {
        const diff = minSetup - budget;
        message = `💰 Add Rp ${formatNumber(diff)} more to get started!`;
      }

      machine = machinePct > 0 ? bestMachine : null;
      grinder = grinderPct > 0 ? bestGrinder : null;
      totalUsed = (machine?.price || 0) + (grinder?.price || 0);
    }

    if (totalUsed <= budget) {
      remaining = budget - totalUsed;
    } else {
      const diff = totalUsed - budget;
      message = `⚠️ Add Rp ${formatNumber(diff)} more to get this setup`;
    }

    setResult({ machine, grinder, message, remaining });
    setShowShare(false);
  };

  const copyShareLink = () => {
    const link = generateShareLink(result.machine, result.grinder, budget);
    navigator.clipboard.writeText(link).then(() => {
      setCopySuccess(true);
      showToast("✓ Link copied to clipboard!", "success");
      setTimeout(() => setCopySuccess(false), 2000);
    }).catch(() => {
      showToast("Failed to copy link", "error");
    });
  };

  // Chart cleanup and update
  useEffect(() => {
    if (chartRef.current && result?.machine && result?.grinder) {
      if (chartInstance.current) {
        chartInstance.current.destroy();
      }

      const ctx = chartRef.current.getContext("2d");
      chartInstance.current = new Chart(ctx, {
        type: "doughnut",
        data: {
          labels: ["Machine", "Grinder", "Remaining"],
          datasets: [{
            data: [result.machine?.price || 0, result.grinder?.price || 0, result.remaining || 0],
            backgroundColor: ["#1f2937", "#6366f1", "#10b981"],
            borderColor: "#ffffff",
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: { position: "bottom" }
          }
        }
      });
    }

    return () => {
      if (chartInstance.current) {
        chartInstance.current.destroy();
      }
    };
  }, [result]);

  return React.createElement("div", { className: "p-10 max-w-3xl mx-auto fade-in" },
    React.createElement(BackButton, { onBack }),
    React.createElement("h2", { className: "text-3xl font-bold mb-8 text-gray-900" }, "💡 Get Recommended Setup"),
    React.createElement("div", { className: "mb-6" },
      React.createElement("label", { className: "text-sm font-semibold text-gray-700 mb-2 block" }, "Your Budget"),
      React.createElement("div", { className: "flex" },
        React.createElement("span", { className: "bg-[#b8a999] px-4 py-3 font-semibold" }, "Rp"),
        React.createElement("input", { 
          type: "text", 
          value: budgetInput, 
          placeholder: "e.g., 5000000", 
          onChange: (e) => handleBudgetChange(e.target.value), 
          className: "w-full p-3 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black",
          inputMode: "numeric"
        })
      ),
      React.createElement("p", { className: "text-xs text-gray-500 mt-1" }, "💡 Tip: Only numbers allowed")
    ),

  const data = type === "machine" ? machines : grinders;
  const allBrands = [...new Set(data.map(i => i.brand))].sort();
  
  useEffect(() => {
    if (data.length > 0) {
      const actualMaxPrice = Math.max(...data.map(i => i.price));
      setMaxPriceValue(actualMaxPrice);
      setPriceRange([0, actualMaxPrice]);
    }

  let filtered = data.filter(item =>
    (item.name.toLowerCase().includes(searchTerm.toLowerCase()) || item.brand.toLowerCase().includes(searchTerm.toLowerCase())) &&

    (selectedBrands.length === 0 || selectedBrands.includes(item.brand))

        )
      ),
      React.createElement("button", { 
        onClick: handleResetFilters, 
        className: "w-full bg-gray-400 text-white py-2 rounded-lg font-semibold hover:bg-gray-500 transition focus:ring-2 focus:ring-offset-2 focus:ring-gray-600"
      }, "🔄 Reset All Filters")
    ),
    allBrands.length > 0 && React.createElement("div", { className: "mb-8 p-4 bg-gray-50 rounded-lg border border-gray-200" },
      React.createElement("p", { className: "text-sm font-semibold text-gray-700 mb-3" }, `🏷️ Filter by Brand (${selectedBrands.length} selected)`),
      React.createElement("div", { className: "flex flex-wrap gap-2" },
        allBrands.map(brand => React.createElement("button", { 
          key: brand, 
          onClick: () => handleBrandToggle(brand), 
          className: `px-4 py-2 rounded-lg text-sm font-semibold transition ${selectedBrands.includes(brand) ? "bg-black text-white shadow-md" : "bg-white border border-gray-300 text-gray-700 hover:border-black hover:bg-gray-50"}`
        }, brand))
      )
    ),
    React.createElement("div", null,
      filtered.length > 0 ? React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8" },
        filtered.map(item => React.createElement("div", { key: item.name, className: "bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-200 hover:shadow-xl transition fade-in cursor-pointer" },
          React.createElement("div", { onClick: () => setModalItem(item), className: "h-full flex flex-col" },
            item.imageUrl && React.createElement("img", { src: item.imageUrl, alt: item.name, className: "w-full h-48 object-cover", onError: (e) => { e.target.style.display = "none"; } }),
            React.createElement("div", { className: "p-4 flex-1 flex flex-col" },
              React.createElement("h3", { className: "font-bold text-lg text-gray-900 mb-1" }, item.name),
              React.createElement("p", { className: "text-gray-600 text-sm mb-2" }, item.brand),
              item.rating && React.createElement("p", { className: "text-sm text-yellow-600 mb-3" }, `⭐ ${item.rating} (${item.reviewCount || 0} reviews)`),
              React.createElement("p", { className: "text-2xl font-bold text-green-600 mb-3 mt-auto" }, `Rp ${formatNumber(item.price)}`),
              React.createElement("p", { className: "text-xs text-gray-500 mb-3" }, `${formatNumber(item.power)} W • ${item.madeIn}`)
            )
          ),
          React.createElement("button", { 
            onClick: (e) => { 
              e.stopPropagation();
              if (addFavorite({ ...item, type })) {
                showToast("❤️ Added to favorites!", "success");
              } else {
                showToast("Already in favorites", "info");
              }
            },
            className: "w-full bg-red-50 text-red-600 py-2 hover:bg-red-100 transition font-semibold text-sm border-t border-gray-200"
          }, "❤️ Add to Favorites")
        ))
      ) : React.createElement("div", { className: "text-center py-16 text-gray-500" },
        React.createElement("p", { className: "text-lg mb-2" }, "😕 No products found"),
        React.createElement("p", { className: "text-sm" }, "Try adjusting your filters or search terms")
      )
    ),
    modalItem && React.createElement(ProductModal, { item: modalItem, isMachine: type === 'machine', onClose: () => setModalItem(null), showToast })
  );
}

function App() {
  const [page, setPage] = useState("home");
  const [machines, setMachines] = useState([]);
  const [grinders, setGrinders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const { toasts, showToast, removeToast } = useToast();

  useEffect(() => {
    setLoading(true);
    const timeout = setTimeout(() => {
      if (loading) {
        setError("Data loading took too long. Please try again.");
        setLoading(false);
      }
    }, 15000); // 15 second timeout

    fetch("https://script.google.com/macros/s/AKfycbwt1UcSPjISrDQnCuDXDzMKt_kplTr2RDf_PE3hkqufn2a266vgwMeIX4SdAr--Lk3vyw/exec")
      .then(res => { 
        clearTimeout(timeout);
        if (!res.ok) throw new Error("Failed to fetch data"); 
        return res.json(); 
      })
      .then(data => {
        if (!Array.isArray(data) || data.length === 0) throw new Error("No data received from server");
        setMachines(data.filter(i => i.type === "machine"));
        setGrinders(data.filter(i => i.type === "grinder"));
        setLoading(false);
      })
      .catch(err => {
        clearTimeout(timeout);
        console.error("Error loading data:", err);
        setError(err.message);
        setLoading(false);
      });

    return () => clearTimeout(timeout);
  }, []);

  if (loading) return React.createElement(LoadingSkeleton);
  if (error) return React.createElement(ErrorFallback, { message: error, onRetry: () => { setLoading(true); setError(null); } });

  return React.createElement(React.Fragment, null,
    page === "home" && React.createElement(Home, { 
      goToRecommend: () => setPage("recommend"), 
      goToCompare: () => setPage("compare"), 
      goToBrowse: () => setPage("browse"), 
      goToFavorites: () => setPage("favorites")
    }),
    page === "favorites" && React.createElement(FavoritesPage, { 
      onBack: () => setPage("home"),
      showToast
    }),
    page === "recommend" && React.createElement(RecommendationPage, { 
      machines, 
      grinders,
      onBack: () => setPage("home"),
      showToast
    }),
    page === "compare" && React.createElement(ComparePage, { 
      machines, 
      grinders,
      onBack: () => setPage("home"),
      showToast
    }),
    page === "browse" && React.createElement(BrowsePage, { 
      machines, 
      grinders,
      onBack: () => setPage("home"),
      showToast
    }),
    React.createElement("div", { className: "toast-container" },
      toasts.map(toast => React.createElement(Toast, { 
        key: toast.id, 
        message: toast.message, 
        type: toast.type, 
        duration: toast.duration,
        onClose: () => removeToast(toast.id)
      }))
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
